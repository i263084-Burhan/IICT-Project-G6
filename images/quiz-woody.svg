<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWoody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1C13" />
      <stop offset="50%" stop-color="#1E120B" />
      <stop offset="100%" stop-color="#140A06" />
    </linearGradient>
    <radialGradient id="ringGlow" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E6B45" />
      <stop offset="40%" stop-color="#694025" />
      <stop offset="70%" stop-color="#3B2213" />
      <stop offset="100%" stop-color="#1B0F08" />
    </radialGradient>
    <linearGradient id="amberSeam" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgWoody)" />
  <!-- Organic Wood Trunk Slice Rings -->
  <g transform="translate(190, 200) rotate(-15)">
    <ellipse cx="0" cy="0" rx="160" ry="145" fill="none" stroke="#3A2316" stroke-width="12" />
    <ellipse cx="-5" cy="2" rx="140" ry="128" fill="none" stroke="#4D2E1C" stroke-width="8" />
    <ellipse cx="-2" cy="-3" rx="122" ry="110" fill="none" stroke="#361F12" stroke-width="10" />
    <ellipse cx="4" cy="5" rx="100" ry="92" fill="none" stroke="#5E3821" stroke-width="7" />
    <ellipse cx="2" cy="0" rx="80" ry="74" fill="none" stroke="#482916" stroke-width="8" />
    <ellipse cx="-3" cy="4" rx="60" ry="55" fill="none" stroke="#75472A" stroke-width="6" />
    <ellipse cx="0" cy="0" rx="42" ry="38" fill="url(#ringGlow)" />
    <!-- Heartwood Core -->
    <ellipse cx="-2" cy="1" rx="24" ry="22" fill="#201008" />
    <circle cx="-1" cy="0" r="10" fill="#140904" />
    <!-- Wood Bark Cracks & Grain Lines -->
    <path d="M-120 -80 Q-60 -40 0 0 Q60 50 130 90" stroke="#1F1109" stroke-width="3" fill="none" opacity="0.6" />
    <path d="M-140 30 Q-70 20 0 0 Q80 -30 140 -60" stroke="#1A0C06" stroke-width="2.5" fill="none" opacity="0.7" />
    <path d="M-30 -130 Q-10 -60 0 0 Q10 80 40 140" stroke="#22130A" stroke-width="2.5" fill="none" opacity="0.5" />
    <!-- Glowing Golden Amber Resin Crevice -->
    <path d="M0 0 Q40 40 85 95 Q110 130 135 140" stroke="url(#amberSeam)" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="85" cy="95" r="5" fill="#FDE68A" opacity="0.8" />
  </g>
  <!-- Ambient Soft Vignette Frame -->
  <rect width="400" height="400" fill="none" stroke="#C89666" stroke-width="1" opacity="0.15" />
</svg>