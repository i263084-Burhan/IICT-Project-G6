<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCozy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1B10" />
      <stop offset="60%" stop-color="#1F1109" />
      <stop offset="100%" stop-color="#130904" />
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F97316" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#DC2626" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="blanketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4C3" />
      <stop offset="50%" stop-color="#CBB9A3" />
      <stop offset="100%" stop-color="#A8937D" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgCozy)" />
  <!-- Ambient Fireplace Embers Hearth Light -->
  <circle cx="200" cy="220" r="140" fill="url(#fireGlow)" />
  <!-- Cashmere Blanket Drape Folds -->
  <g transform="translate(60, 210)">
    <path d="M0 70 Q70 10 140 50 Q210 90 280 40 L280 140 L0 140 Z" fill="url(#blanketGrad)" opacity="0.9" />
    <path d="M0 100 Q70 40 140 80 Q210 120 280 70" stroke="#8E7861" stroke-width="2.5" fill="none" opacity="0.6" />
    <path d="M30 115 Q100 65 170 100 Q230 130 280 95" stroke="#78634D" stroke-width="2" fill="none" opacity="0.5" />
    <!-- Fringe Edges -->
    <line x1="10" y1="138" x2="10" y2="148" stroke="#A8937D" stroke-width="2" />
    <line x1="30" y1="138" x2="30" y2="148" stroke="#A8937D" stroke-width="2" />
    <line x1="50" y1="138" x2="50" y2="148" stroke="#A8937D" stroke-width="2" />
    <line x1="70" y1="138" x2="70" y2="148" stroke="#A8937D" stroke-width="2" />
    <line x1="90" y1="138" x2="90" y2="148" stroke="#A8937D" stroke-width="2" />
    <line x1="110" y1="138" x2="110" y2="148" stroke="#A8937D" stroke-width="2" />
    <line x1="130" y1="138" x2="130" y2="148" stroke="#A8937D" stroke-width="2" />
  </g>
  <!-- Warm Ceramic Mug with Whimsical Steam Wisps -->
  <g transform="translate(200, 160)">
    <!-- Mug Body -->
    <rect x="-25" y="0" width="50" height="55" rx="8" fill="#F8F4EC" stroke="#D1BEA8" stroke-width="1.5" />
    <!-- Handle -->
    <path d="M25 10 C40 10 40 40 25 40" stroke="#D1BEA8" stroke-width="4.5" fill="none" />
    <!-- Steam Swirls -->
    <path d="M-10 -10 Q-15 -25 -5 -40" stroke="#FED7AA" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M5 -15 Q15 -30 5 -50" stroke="#FED7AA" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>
</svg>