  <line x1="210" y1="450" x2="390" y2="450" stroke="#765B33" stroke-width="1.5"/>
  <line x1="210" y1="500" x2="390" y2="500" stroke="#765B33" stroke-width="1.5"/>
  <!-- Oversized Gold Cap -->
  <rect x="165" y="160" width="270" height="270" rx="22" fill="url(#goldBrushed)" stroke="#F6E9CE" stroke-width="1.5"/>
  <rect x="190" y="182" width="32" height="225" rx="14" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="300" cy="295" r="58" fill="none" stroke="#765B33" stroke-width="1.5" opacity="0.7"/>
  <text x="300" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#4A381D">N&amp;N</text>
  <text x="300" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="3.5" fill="#4A381D">PARIS • LAHORE</text>
