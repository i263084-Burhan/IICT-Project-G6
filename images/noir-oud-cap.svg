      <stop offset="0%" stop-color="#221D1A"/>
      <stop offset="100%" stop-color="#14110F"/>
    </linearGradient>
    <linearGradient id="goldBrushed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6E42"/>
      <stop offset="30%" stop-color="#DFC493"/>
      <stop offset="55%" stop-color="#F3E2BE"/>
      <stop offset="80%" stop-color="#B9965E"/>
      <stop offset="100%" stop-color="#765B33"/>
