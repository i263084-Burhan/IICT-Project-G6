  </defs>
  <rect width="600" height="720" fill="url(#capBg)"/>
  <circle cx="300" cy="340" r="220" fill="#2D2520" opacity="0.45"/>
  <!-- Bottle Shoulder -->
  <path d="M90,560 Q300,505 510,560 L540,720 L60,720 Z" fill="#1A1614" stroke="#3D342E" stroke-width="2"/>
