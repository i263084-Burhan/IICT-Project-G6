<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFloral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF1EE" />
      <stop offset="50%" stop-color="#F5E4E4" />
      <stop offset="100%" stop-color="#EED1D3" />
    </linearGradient>
    <radialGradient id="roseGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FCECEE" />
      <stop offset="60%" stop-color="#E69CA4" />
      <stop offset="100%" stop-color="#B84E5B" />
    </radialGradient>
    <radialGradient id="petalDark" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D95C6B" />
      <stop offset="70%" stop-color="#A83242" />
      <stop offset="100%" stop-color="#6E1B26" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#802030" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgFloral)" />
  <circle cx="200" cy="190" r="140" fill="#FCEAE9" opacity="0.6" filter="url(#softShadow)" />
  <!-- Leaves -->
  <g opacity="0.85">
    <path d="M120 230 C80 250 85 300 130 300 C150 270 145 240 120 230 Z" fill="#4A6B53" />
    <path d="M120 230 Q110 265 130 300" stroke="#7E9F86" stroke-width="2" fill="none" />
    <path d="M280 140 C320 120 330 170 300 200 C270 190 270 160 280 140 Z" fill="#587A60" />
    <path d="M280 140 Q305 165 300 200" stroke="#8EAF96" stroke-width="2" fill="none" />
  </g>
  <!-- Rose Blossom Outer Petals -->
  <g filter="url(#softShadow)">
    <path d="M200 70 C150 70 110 110 110 160 C110 210 140 240 200 270 C260 240 290 210 290 160 C290 110 250 70 200 70 Z" fill="url(#roseGlow)" opacity="0.9" />
    <path d="M140 130 C120 160 125 210 160 235 C175 195 155 150 140 130 Z" fill="url(#petalDark)" opacity="0.4" />
    <path d="M260 130 C280 160 275 210 240 235 C225 195 245 150 260 130 Z" fill="url(#petalDark)" opacity="0.4" />
    <!-- Mid petals -->
    <path d="M150 160 C140 200 170 230 200 240 C230 230 260 200 250 160 C230 180 170 180 150 160 Z" fill="url(#petalDark)" opacity="0.75" />
    <path d="M165 140 C155 110 185 100 200 110 C215 100 245 110 235 140 C215 130 185 130 165 140 Z" fill="url(#roseGlow)" />
    <!-- Rose Heart Swirl -->
    <path d="M175 165 C170 140 190 130 200 135 C215 140 225 155 215 175 C205 190 185 185 175 165 Z" fill="url(#petalDark)" />
    <path d="M188 155 C185 145 195 140 200 142 C208 145 210 155 205 165 C198 170 190 168 188 155 Z" fill="#FFE3E7" opacity="0.85" />
  </g>
  <!-- Rosebuds & Dewdrops -->
  <circle cx="230" cy="120" r="3.5" fill="#FFFFFF" opacity="0.75" />
  <circle cx="165" cy="185" r="2.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="215" cy="210" r="3" fill="#FFFFFF" opacity="0.6" />
</svg>