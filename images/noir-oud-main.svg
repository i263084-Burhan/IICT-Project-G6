<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720">
  <defs>
    <linearGradient id="bgStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE7DB"/>
      <stop offset="100%" stop-color="#DDD0BE"/>
    </linearGradient>
    <linearGradient id="glassNoir" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1715"/>
      <stop offset="30%" stop-color="#2D2622"/>
      <stop offset="70%" stop-color="#14110F"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A88958"/>
      <stop offset="40%" stop-color="#E5CD9F"/>
      <stop offset="75%" stop-color="#C6A774"/>
      <stop offset="100%" stop-color="#8C6E42"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#bgStone)"/>
  <!-- Travertine Stone Plinth -->
  <ellipse cx="300" cy="585" rx="185" ry="26" fill="#C7B9A5" opacity="0.5"/>
  <rect x="135" y="535" width="330" height="55" rx="6" fill="#E6DDD0" stroke="#CFC2AF" stroke-width="1.5"/>
  <!-- Bottle Shadow -->
  <ellipse cx="300" cy="534" rx="108" ry="12" fill="#14110F" opacity="0.22"/>
  <!-- Perfume Bottle Body -->
  <rect x="195" y="255" width="210" height="275" rx="18" fill="url(#glassNoir)" stroke="#3B332E" stroke-width="2"/>
  <!-- Inner glass reflection -->
  <rect x="210" y="270" width="16" height="245" rx="8" fill="#FFFFFF" opacity="0.09"/>
  <!-- Gold Collar & Cap -->
  <rect x="262" y="220" width="76" height="36" rx="4" fill="url(#goldCap)"/>
  <rect x="248" y="142" width="104" height="78" rx="8" fill="url(#goldCap)" stroke="#8C6E42" stroke-width="1"/>
  <rect x="260" y="150" width="12" height="62" rx="4" fill="#FFF7E6" opacity="0.35"/>
  <!-- Front Label -->
  <rect x="228" y="315" width="144" height="162" rx="4" fill="#FAF6F0" stroke="#C6A774" stroke-width="1.5"/>
  <rect x="234" y="321" width="132" height="150" rx="2" fill="none" stroke="#DCD4C8" stroke-width="0.8"/>
  <text x="300" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#5C554F">NOTES &amp; NOIR</text>
  <line x1="265" y1="374" x2="335" y2="374" stroke="#C6A774" stroke-width="1"/>
  <text x="300" y="408" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#1A1715">Noir Oud</text>
  <text x="300" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.5" fill="#5C554F">EAU DE PARFUM</text>
  <text x="300" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="#8C6E42">50 ML / 1.7 FL OZ</text>
</svg>
