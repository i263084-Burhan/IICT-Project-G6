<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Midnight Oud perfume in a dark obsidian square glass bottle with black oud wood">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#F1E6D9"/>
      <stop offset="65%" stop-color="#E6D8C7"/>
      <stop offset="100%" stop-color="#D2C0AA"/>
    </radialGradient>
    <linearGradient id="obsidianGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353236"/>
      <stop offset="35%" stop-color="#1A181B"/>
      <stop offset="78%" stop-color="#0E0D0F"/>
      <stop offset="100%" stop-color="#29262A"/>
    </linearGradient>
    <linearGradient id="metalCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D2A28"/>
      <stop offset="32%" stop-color="#6A645E"/>
      <stop offset="58%" stop-color="#3E3A37"/>
      <stop offset="100%" stop-color="#1E1C1A"/>
    </linearGradient>
    <linearGradient id="oudWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A2D25"/>
      <stop offset="60%" stop-color="#221914"/>
      <stop offset="100%" stop-color="#130E0B"/>
    </linearGradient>
  </defs>

  <!-- Soft warm beige backdrop -->
  <rect width="600" height="600" fill="url(#studioBg)"/>
  <rect x="0" y="420" width="600" height="180" fill="#DFD0BE" opacity="0.55"/>

  <!-- Soft ground shadow -->
  <ellipse cx="300" cy="492" rx="185" ry="26" fill="#2B2119" opacity="0.22"/>

  <!-- Charred black oud wood chips -->
  <g fill="url(#oudWood)" stroke="#4C3B30" stroke-width="1.5">
    <path d="M78 468 Q125 436 184 452 L176 486 Q116 492 72 478 Z"/>
    <path d="M108 486 Q155 462 204 476 L192 504 Q142 510 98 496 Z"/>
    <path d="M402 456 Q468 432 524 462 L512 490 Q448 494 396 476 Z"/>
    <path d="M424 484 Q478 468 532 488 L522 508 Q468 514 418 498 Z"/>
  </g>

  <!-- Bottle neck & dark metallic cap -->
  <rect x="272" y="160" width="56" height="22" rx="2" fill="#4E4842"/>
  <rect x="250" y="92" width="100" height="70" rx="6" fill="url(#metalCap)" stroke="#7B746C" stroke-width="1.5"/>
  <rect x="262" y="98" width="12" height="58" rx="3" fill="#FFFFFF" opacity="0.16"/>

  <!-- Square dark obsidian glass bottle -->
  <rect x="190" y="182" width="220" height="300" rx="16" fill="url(#obsidianGlass)" stroke="#524C4A" stroke-width="2"/>
  <!-- Glass highlights -->
  <rect x="204" y="196" width="18" height="272" rx="6" fill="#FFFFFF" opacity="0.1"/>
  <rect x="382" y="198" width="10" height="268" rx="4" fill="#FFFFFF" opacity="0.06"/>
  <rect x="198" y="458" width="204" height="16" rx="8" fill="#FFFFFF" opacity="0.07"/>

  <!-- Cream label -->
  <rect x="226" y="254" width="148" height="156" rx="4" fill="#F7F2EA" stroke="#DFD4C5" stroke-width="1.5"/>
  <text x="300" y="314" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#181614">MIDNIGHT</text>
  <text x="300" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#181614">OUD</text>
  <line x1="266" y1="360" x2="334" y2="360" stroke="#C5B9A8" stroke-width="1"/>
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.5" fill="#5D544B">EAU DE PARFUM</text>
</svg>
