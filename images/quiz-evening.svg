<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEvening" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14111C" />
      <stop offset="50%" stop-color="#0E0B14" />
      <stop offset="100%" stop-color="#07050A" />
    </linearGradient>
    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgEvening)" />
  <!-- Elegant Evening Candle & Stemware Ambient Scene -->
  <!-- Warm Bokeh Orbs in Background -->
  <circle cx="80" cy="110" r="45" fill="#F59E0B" opacity="0.08" />
  <circle cx="310" cy="90" r="55" fill="#FBBF24" opacity="0.07" />
  <circle cx="280" cy="220" r="35" fill="#D97706" opacity="0.06" />
  <circle cx="100" cy="250" r="40" fill="#F59E0B" opacity="0.05" />
  <!-- Table Surface Shadow -->
  <rect x="0" y="270" width="400" height="130" fill="#0A080D" opacity="0.8" />
  <line x1="0" y1="270" x2="400" y2="270" stroke="#B48B57" stroke-width="1.5" opacity="0.3" />
  <!-- Glowing Luminary / Candle in Glass Cylinder -->
  <g transform="translate(200, 240)">
    <!-- Ambient Halo Glow -->
    <circle cx="0" cy="-60" r="110" fill="url(#candleGlow)" />
    <!-- Glass Hurricane Votive -->
    <rect x="-35" y="-100" width="70" height="130" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- Wax Candle Body -->
    <rect x="-24" y="-35" width="48" height="65" rx="3" fill="#FAF6F0" fill-opacity="0.9" />
    <!-- Wick & Teardrop Flame -->
    <line x1="0" y1="-35" x2="0" y2="-45" stroke="#1F2937" stroke-width="2" />
    <path d="M0 -72 C-8 -58 -8 -45 0 -45 C8 -45 8 -58 0 -72 Z" fill="url(#flameGrad)" />
    <ellipse cx="0" cy="-55" rx="3" ry="7" fill="#FFFFFF" />
  </g>
  <!-- Fine Crystal Stemware Silhouette Beside Candle -->
  <g transform="translate(100, 240)" opacity="0.45">
    <path d="M-18 -80 C-18 -45 0 -35 0 -25 L0 15 M-15 15 L15 15 M0 -25 C0 -35 18 -45 18 -80 Z" stroke="#E2E8F0" stroke-width="1.5" fill="none" />
  </g>
</svg>