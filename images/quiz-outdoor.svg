<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOutdoor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="45%" stop-color="#BAE6FD" />
      <stop offset="75%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgOutdoor)" />
  <!-- Radiant Mediterranean Golden Sun -->
  <circle cx="280" cy="110" r="100" fill="url(#sunGlow)" />
  <circle cx="280" cy="110" r="38" fill="#FFFBEB" />
  <!-- Rolling Olive Groves & Sunlit Garden Hills -->
  <path d="M-20 320 Q80 260 200 300 Q320 340 420 280 L420 400 L-20 400 Z" fill="#65A30D" opacity="0.8" />
  <path d="M-20 350 Q120 310 260 340 Q360 360 420 330 L420 400 L-20 400 Z" fill="#4D7C0F" />
  <!-- Sunlit Citrus Branch with Golden Fruit -->
  <g transform="translate(110, 160)">
    <path d="M-70 70 Q-10 10 90 -20 Q140 -30 180 -10" stroke="#5C3B18" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Citrus Leaves -->
    <path d="M10 8 C-10 -15 0 -45 25 -50 C40 -30 30 0 10 8 Z" fill="#15803D" />
    <path d="M60 -10 C45 -35 60 -60 85 -60 C95 -40 80 -15 60 -10 Z" fill="#16A34A" />
    <path d="M120 -20 C105 -45 125 -70 150 -65 C160 -45 140 -25 120 -20 Z" fill="#15803D" />
    <!-- Sun-Ripened Mediterranean Golden Oranges -->
    <circle cx="35" cy="40" r="28" fill="#F97316" />
    <circle cx="30" cy="35" r="24" fill="#FB923C" />
    <circle cx="22" cy="28" r="7" fill="#FEF08A" opacity="0.6" />
    <circle cx="115" cy="15" r="24" fill="#F97316" />
    <circle cx="110" cy="12" r="20" fill="#FB923C" />
    <circle cx="104" cy="6" r="6" fill="#FEF08A" opacity="0.6" />
  </g>
</svg>