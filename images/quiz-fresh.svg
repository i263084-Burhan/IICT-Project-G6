<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFresh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142E20" />
      <stop offset="50%" stop-color="#0E2317" />
      <stop offset="100%" stop-color="#07170E" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <radialGradient id="dewDrop" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#D1FAE5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgFresh)" />
  <!-- Dewy Botanical Leaves -->
  <g transform="translate(200, 210)">
    <!-- Background Secondary Leaf -->
    <path d="M0 60 C-90 40 -140 -50 -90 -130 C-40 -160 30 -110 0 60 Z" fill="url(#leafGrad2)" opacity="0.65" transform="rotate(-35)" />
    <!-- Background Right Leaf -->
    <path d="M0 60 C90 30 150 -50 110 -130 C50 -160 -10 -100 0 60 Z" fill="url(#leafGrad2)" opacity="0.75" transform="rotate(25)" />
    <!-- Foreground Dominant Center Leaf -->
    <path d="M0 90 C-110 30 -120 -90 0 -170 C120 -90 110 30 0 90 Z" fill="url(#leafGrad1)" />
    <!-- Center Leaf Rib & Fine Veins -->
    <path d="M0 90 Q-2 -40 0 -170" stroke="#064E3B" stroke-width="4" fill="none" opacity="0.7" />
    <path d="M0 40 Q-35 15 -70 10" stroke="#064E3B" stroke-width="2" fill="none" opacity="0.5" />
    <path d="M0 40 Q35 15 70 10" stroke="#064E3B" stroke-width="2" fill="none" opacity="0.5" />
    <path d="M0 -20 Q-40 -45 -75 -60" stroke="#064E3B" stroke-width="2" fill="none" opacity="0.5" />
    <path d="M0 -20 Q40 -45 75 -60" stroke="#064E3B" stroke-width="2" fill="none" opacity="0.5" />
    <path d="M0 -80 Q-30 -105 -55 -120" stroke="#064E3B" stroke-width="1.8" fill="none" opacity="0.5" />
    <path d="M0 -80 Q30 -105 55 -120" stroke="#064E3B" stroke-width="1.8" fill="none" opacity="0.5" />
    <!-- White Neroli / Citrus Petals Accent -->
    <circle cx="75" cy="50" r="16" fill="#F8FAFC" opacity="0.9" />
    <circle cx="95" cy="55" r="14" fill="#F1F5F9" opacity="0.85" />
    <circle cx="85" cy="35" r="14" fill="#FFFFFF" opacity="0.9" />
    <circle cx="85" cy="50" r="6" fill="#FBBF24" />
    <!-- Dew Drops with Specular Highlights -->
    <ellipse cx="-25" cy="-40" rx="9" ry="7" fill="url(#dewDrop)" transform="rotate(-15 -25 -40)" />
    <circle cx="-27" cy="-42" r="2.5" fill="#FFFFFF" />
    <ellipse cx="35" cy="-85" rx="7" ry="5" fill="url(#dewDrop)" transform="rotate(20 35 -85)" />
    <circle cx="34" cy="-86" r="1.8" fill="#FFFFFF" />
  </g>
</svg>