<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDaily" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="60%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#EAE0D2" />
    </linearGradient>
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FEF3C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </linearGradient>
    <filter id="deskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5C4D3C" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgDaily)" />
  <!-- Diagonal Morning Sunbeam Cast -->
  <polygon points="0 0, 220 0, 400 320, 160 400, 0 200" fill="url(#sunBeam)" />
  <!-- Minimalist Atelier Desk Accessories -->
  <g filter="url(#deskShadow)">
    <!-- Linen Journal -->
    <rect x="70" y="160" width="160" height="180" rx="6" fill="#F8F4EC" stroke="#D8C8B4" stroke-width="1.5" />
    <line x1="85" y1="160" x2="85" y2="340" stroke="#CBB9A3" stroke-width="2" />
    <line x1="105" y1="200" x2="195" y2="200" stroke="#DACDC0" stroke-width="2" />
    <line x1="105" y1="225" x2="180" y2="225" stroke="#DACDC0" stroke-width="2" />
    <line x1="105" y1="250" x2="190" y2="250" stroke="#DACDC0" stroke-width="2" />
    <!-- Streamlined Gold Atelier Fountain Pen -->
    <line x1="225" y1="140" x2="275" y2="290" stroke="#B48B57" stroke-width="6" stroke-linecap="round" />
    <line x1="225" y1="140" x2="232" y2="160" stroke="#14110F" stroke-width="7" stroke-linecap="round" />
    <!-- Small Travel Flacon -->
    <rect x="250" y="80" width="60" height="90" rx="4" fill="#FFFFFF" fill-opacity="0.8" stroke="#D1BEA8" stroke-width="1.5" />
    <rect x="268" y="65" width="24" height="15" rx="2" fill="#14110F" />
    <line x1="280" y1="58" x2="280" y2="65" stroke="#B48B57" stroke-width="4" />
    <rect x="262" y="105" width="36" height="40" fill="#FAF6F0" stroke="#E2D4C3" stroke-width="1" />
  </g>
  <!-- Fresh Green Olive Leaf Sprig -->
  <g transform="translate(110, 120) rotate(-25)">
    <path d="M0 0 Q30 -10 60 0" stroke="#5E7D63" stroke-width="2" fill="none" />
    <ellipse cx="20" cy="-6" rx="14" ry="6" fill="#6B8E23" opacity="0.85" transform="rotate(-15 20 -6)" />
    <ellipse cx="45" cy="-4" rx="13" ry="5.5" fill="#556B2F" opacity="0.85" transform="rotate(20 45 -4)" />
  </g>
</svg>