<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720">
  <defs>
    <linearGradient id="boxWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE4D6"/>
      <stop offset="100%" stop-color="#DACBB6"/>
    </linearGradient>
    <linearGradient id="linenBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24201D"/>
      <stop offset="100%" stop-color="#14110F"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#boxWall)"/>
  <!-- Soft Drop Shadow -->
  <polygon points="145,575 465,575 495,605 175,605" fill="#14110F" opacity="0.18"/>
  <!-- Packaging Box -->
  <rect x="145" y="135" width="310" height="445" rx="8" fill="url(#linenBox)" stroke="#3D3530" stroke-width="2"/>
  <rect x="165" y="155" width="270" height="405" rx="4" fill="none" stroke="#C6A774" stroke-width="1.2" opacity="0.8"/>
  <!-- Gold Foil Emblem -->
  <circle cx="300" cy="255" r="34" fill="none" stroke="#D8BC8B" stroke-width="1.5"/>
  <text x="300" y="263" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#D8BC8B">N&amp;N</text>
  <text x="300" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="28" letter-spacing="2" fill="#FAF6F0">Notes &amp; Noir</text>
  <text x="300" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="5" fill="#C6A774">FRAGRANCES</text>
  <line x1="230" y1="396" x2="370" y2="396" stroke="#C6A774" stroke-width="1"/>
  <text x="300" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#E9DEC9">NOIR OUD</text>
  <text x="300" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#A99F94">EXTRAIT &amp; EAU DE PARFUM</text>
</svg>
